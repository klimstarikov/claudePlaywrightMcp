# Test automation configuration — read by Tal (test-automation-lead) at pipeline start
# Generated by scout on 2026-06-17.

# tms: (optional) Uncomment and configure if a TMS integration is needed.
#   adapter: xray | zephyr | testrail | azure | markdown
#   project_key: ...
#   base_url_env: JIRA_BASE_URL
#   user_email_env: JIRA_USER_EMAIL
#   api_token_env: JIRA_API_TOKEN

feature_files:
  directory: features/
  pattern: "**/*.feature"

framework:
  name: playwright
  version: "1.58.2"
  language: typescript
  run_command: "npx playwright test"
  ci_command: "npx playwright test"
  config_file: playwright.config.ts
  base_url: https://automationteststore.com/
  browser: chromium
  headless: true

automation_pr:
  base_branch: main
  merge_policy: human-approved
  merge_strategy: squash
